<ion-content>

  <div class="shortPresentation">
    <h2>splotify</h2>
    <p>The best place where u could get information abaout ur favorite artist, genres, and listen some music</p>
  </div>

  <div class="profile-default">
    <figure>
      <img src="assets/images/default-user-icon-12.png" alt="Imagen default usuario">
      <p>!Registrate aqui!</p>
    </figure>

    <form  class="registerForm"  [formGroup]="registerForm" (ngSubmit)="registerUser(registerForm.value)" >
    

    <ion-item>
      <ion-input labelPlacement="floating" label="nombre" type="text" placeholder="pedrito" formControlName="nombre"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input labelPlacement="floating" label="apellido" type="text" placeholder="sanchez" formControlName="apellido"></ion-input> 
    </ion-item>

    <ion-item>
      <ion-input labelPlacement="floating" label="email" type="email" placeholder="example@splotify.com" formControlName="email"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input labelPlacement="floating" label="Password" type="password" placeholder="#MyPassw0rd123*" formControlName="password"></ion-input>
    </ion-item>

    <div>
      <ng-container *ngFor="let validation of validationMessages.email">
        <div *ngIf="(
          registerForm.get('email')?.hasError(validation.type) && registerForm.get('email')?.dirty
          )">
          {{validation.message}}
        </div>
      </ng-container>

      <ng-container *ngFor="let validation of validationMessages.password">
        <div *ngIf="(
          registerForm.get('password')?.hasError(validation.type) && registerForm.get('password')?.dirty
          )">
          {{validation.message}}
        </div>
      </ng-container>

      <ng-container *ngFor="let validation of validationMessages.nombre">
        <div *ngIf="(
          registerForm.get('nombre')?.hasError(validation.type) && registerForm.get('nombre')?.dirty
          )">
          {{validation.message}}
        </div>
      </ng-container>

      <ng-container *ngFor="let validation of validationMessages.apellido">
        <div *ngIf="(
          registerForm.get('apellido')?.hasError(validation.type) && registerForm.get('apellido')?.dirty
          )">
          {{validation.message}}
        </div>
      </ng-container>

    </div>

    <ion-button
     [disabled]="!registerForm.valid"
     type="submit">
     Registrarse
    </ion-button>

    <p class="goLogin">
    Already have a account? <br>
    <ion-button fill="clear" (click)="goLogin()">Logeate here</ion-button>
  </p> 

  </form>
  

  </div>
</ion-content>
