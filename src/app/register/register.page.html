<ion-content [fullscreen]="true">
  <div class="register-container">
    <div class="shortPresentation">
      <h2>Splotify</h2>
      <p>The best place where you can get information about your favorite artists, genres, and enjoy some music.</p>
    </div>

    <div class="profile-default">
      <figure>
        <img src="assets/images/default-user-icon-12.png" alt="User default image" />
        <p>¡Regístrate aquí!</p>
      </figure>
    </div>

    <form
      class="registerForm"
      [formGroup]="registerForm"
      (ngSubmit)="registerUser(registerForm.value)"
    >
      <ion-item lines="inset">
        <ion-input
          label="Nombre"
          labelPlacement="floating"
          type="text"
          placeholder="Pedrito"
          formControlName="nombre"
        ></ion-input>
      </ion-item>

      <ion-item lines="inset">
        <ion-input
          label="Apellido"
          labelPlacement="floating"
          type="text"
          placeholder="Sánchez"
          formControlName="apellido"
        ></ion-input>
      </ion-item>

      <ion-item lines="inset">
        <ion-input
          label="Email"
          labelPlacement="floating"
          type="email"
          placeholder="example@splotify.com"
          formControlName="email"
        ></ion-input>
      </ion-item>

      <ion-item lines="inset">
        <ion-input
          label="Password"
          labelPlacement="floating"
          type="password"
          placeholder="#MyPassw0rd123*"
          formControlName="password"
        ></ion-input>
      </ion-item>

      <div class="validationErrors">
        <ng-container *ngFor="let validation of validationMessages.nombre">
          <div *ngIf="registerForm.get('nombre')?.hasError(validation.type) && registerForm.get('nombre')?.dirty">
            {{ validation.message }}
          </div>
        </ng-container>

        <ng-container *ngFor="let validation of validationMessages.apellido">
          <div *ngIf="registerForm.get('apellido')?.hasError(validation.type) && registerForm.get('apellido')?.dirty">
            {{ validation.message }}
          </div>
        </ng-container>

        <ng-container *ngFor="let validation of validationMessages.email">
          <div *ngIf="registerForm.get('email')?.hasError(validation.type) && registerForm.get('email')?.dirty">
            {{ validation.message }}
          </div>
        </ng-container>

        <ng-container *ngFor="let validation of validationMessages.password">
          <div *ngIf="registerForm.get('password')?.hasError(validation.type) && registerForm.get('password')?.dirty">
            {{ validation.message }}
          </div>
        </ng-container>
      </div>

      <ion-button expand="block" type="submit" [disabled]="!registerForm.valid">
        Registrarse
      </ion-button>

      <div class="goLogin">
        Already have an account? <br />
        <ion-button fill="clear" size="small" (click)="goLogin()">Logeate here</ion-button>
      </div>
    </form>
  </div>
</ion-content>
