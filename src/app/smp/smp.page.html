<ion-content>
  <ion-list>
    <ion-item *ngFor="let song of songs; index as i" (click)="selectSong(song)" class="song-item">
      <ion-avatar slot="start" class="song-avatar">
        <div class="song-number">{{ i + 1 }}</div>
      </ion-avatar>
      <ion-label>
        <h2>{{ song.name }}</h2>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
